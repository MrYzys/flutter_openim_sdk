# Run with `dart run ffigen --config ffigen.yaml`.
name: OpenimFfiBindings
description: |
  Bindings for `libopenim_sdk_ffi.h` bridging the openim-sdk-core-2 Go library.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/openim_ffi_bindings_generated.dart'
headers:
  entry-points:
    - 'ffi/openim-sdk-core-2/build/linux/amd64/libopenim_sdk_ffi.h'
  include-directives:
    - 'ffi/openim-sdk-core-2/build/linux/amd64/libopenim_sdk_ffi.h'
    - 'ffi/openim-sdk-core-2/main/include/*.h'
compiler-opts:
  - '-Iffi/openim-sdk-core-2/main'
  - '-Iffi/openim-sdk-core-2/main/include'
  - '-Iffi/openim-sdk-core-2/build/linux/amd64'
functions:
  include:
    - '.*'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
